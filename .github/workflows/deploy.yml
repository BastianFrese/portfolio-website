name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serielle Deployments: Kein paralleler Zugriff auf den Webserver
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Self-Hosted-Runner läuft direkt auf LXC 402 (portfolio-ws) —
    # kein SSH, kein Port-Forward, keine Deploy-Keys nötig.
    runs-on: [self-hosted, linux, portfolio]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish
        run: dotnet publish Portfolio.csproj -c Release -r linux-x64 --self-contained false -o publish

      - name: Package
        # --owner=0 --group=0: sonst gehören die extrahierten Dateien dem Runner-User
        # und der Extrahier-Schritt schlägt beim nächsten Deploy mit chown-Fehlern fehl.
        run: tar -czf app.tar.gz --owner=0 --group=0 -C publish .

      - name: Deploy (lokal auf dem Ziel-Host)
        run: |
          set -e
          APP_DIR=/var/www/portfolio
          TS=$(date +%Y%m%d-%H%M%S)
          sudo mkdir -p $APP_DIR/releases/$TS
          tar -xzf app.tar.gz -C $APP_DIR/releases/$TS
          sudo ln -sfn $APP_DIR/releases/$TS $APP_DIR/current
          sudo systemctl restart portfolio
          sleep 3
          curl -fsS --max-time 10 http://127.0.0.1:5000/health/live

      - name: Smoke test (öffentlich)
        run: |
          curl -fsSL --max-time 15 https://bastian-frese.de/health/live | grep -q "healthy"

      - name: Alte Releases aufräumen (behalte 5)
        if: success()
        run: |
          cd /var/www/portfolio/releases
          ls -1t | tail -n +6 | sudo xargs -r rm -rf